name: Test & Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: notas_testing
          MYSQL_USER: notas
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, xml, ctype, json, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          npm ci && npm run build

      - name: Run Tests
        run: php artisan test --stop-on-failure
        env:
          APP_ENV: testing
          # A chave da Notaas NÃO existe aqui. Se algum caminho escapar do
          # emissor falso, ele falha por falta de chave em vez de emitir uma
          # nota de verdade a partir do CI.
          FISCAL_EMISSOR: fake
          NOTAAS_API_KEY: ''
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: notas_testing
          DB_USERNAME: notas
          DB_PASSWORD: secret
          BCRYPT_ROUNDS: 4
          CACHE_STORE: array
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    # Deploys nunca em paralelo: merges em sequência rápida disparariam dois
    # SSH simultâneos brigando no composer e no cache de config. Um por vez, e
    # os pendentes esperam em vez de cancelar o que está no meio.
    concurrency:
      group: deploy-notas-producao
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: /home/deploy/deploy-notas.sh
