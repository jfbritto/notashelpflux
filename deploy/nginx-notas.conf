# notas.helpflux.com.br na VPS da HelpFlux.
#
# Instalação:
#   curl -fsSL https://raw.githubusercontent.com/jfbritto/notashelpflux/main/deploy/nginx-notas.conf -o /etc/nginx/sites-available/notas
#   ln -sf /etc/nginx/sites-available/notas /etc/nginx/sites-enabled/notas
#   nginx -t && systemctl reload nginx
#
# O TLS entra depois pelo certbot (--nginx), que reescreve este arquivo com o
# bloco 443. O socket é o do PHP 8.4 DE PROPÓSITO: o 8.3 é do TreinaEdu, e
# mexer num afeta o outro (lição de agosto/2026 com o pm.max_children).
server {
    listen 80;
    listen [::]:80;
    server_name notas.helpflux.com.br;
    root /var/www/notas/public;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.php;
    charset utf-8;

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Robô caça .env e .git o dia inteiro (visto no log do veiculos em
    # 12/08/2026). Nega tudo que começa com ponto, exceto o well-known do
    # certbot.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
